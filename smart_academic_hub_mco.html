<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Academic Hub</title>
<style>
   
*{box-sizing:border-box}
body{
  margin:0;
  padding:30px;
  background:powderblue;
  font-family:Arial,sans-serif;
  color:darkcyan
}

header{
  text-align:center;
  margin-bottom:30px
}
h1{
  color:palevioletred;
  margin-bottom:8px
}
header p{
  color:palevioletred
}

main{
  max-width:1100px;
  margin:auto;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:22px
}

section{
  background:whitesmoke;
  padding:24px;
  border-radius:14px;
  box-shadow:0 5px 20px #00000010
}

h2{margin-top:0}

button{
  background:palevioletred;
  color:white;
  border:0;
  border-radius:7px;
  padding:10px 14px;
  cursor:pointer
}

input,select{
  width:100%;
  padding:11px;
  border:1px solid #ddd;
  border-radius:7px;
  margin:7px 0 14px
}

.result{
  background:linear-gradient(120deg,pink);
  color:white;
  text-align:center;
  padding:25px;
  border-radius:12px;
  margin:15px 0
}

.result strong{display:block;font-size:42px;margin-top:8px}
.item{
  border:1px solid #e5eaf0;
  border-radius:8px;
  padding:12px;
  margin-top:10px;
  display:flex;
  justify-content:space-between;
  gap:10px
}
.item small{display:block;color:#68737d;margin-top:5px}
.remove{background:#fff0f0;color:#b83a3a}
#courseForm[hidden]{display:none}

@media(max-width:750px){main{grid-template-columns:1fr}body{padding:18px}}
</style>
</head>
<body>
<header>
<h1>Smart Academic Hub</h1>
<p>Functional Trackers &amp; Calculators for Everyday College Management</p>
</header>

<main>
<section>
<h2>GPA Calculator <button onclick="showCourseForm()">+ Add Course</button></h2>
<p>Input course units and grades to calculate. Updates instantly.</p>
<div class="result">Estimated Semester GPA<strong id="gpa">0.00</strong></div>

<form id="courseForm" hidden>
<input id="courseName" placeholder="Course name" required>
<input id="units" type="number" min="0.5" step="0.5" placeholder="Course units" required>
<input id="grade" type="number" min="1" max="5" step="0.01" placeholder="Grade (1.00–5.00)" required>
<button type="submit">Save Course</button>
</form>
<div id="courses"></div>
</section>

<section>
<h2>Task &amp; Exam Countdown</h2>
<form id="taskForm">
<label>Title / Topic</label>
<input id="taskTitle" placeholder="e.g. Programming Project" required>
<label>Assessment Type</label>
<select id="taskType">
<option>Project / MCO</option><option>Assignment</option><option>Quiz</option>
<option>Exam</option><option>Presentation</option>
</select>
<label>Due Date &amp; Time</label>
<input id="dueDate" type="datetime-local" required>
<button type="submit">Add Tracker</button>
</form>
<div id="tasks"></div>
</section>
</main>

<script>
let courses = JSON.parse(localStorage.getItem("courses") || "[]");
let tasks = JSON.parse(localStorage.getItem("tasks") || "[]");

function save(){
  localStorage.setItem("courses",JSON.stringify(courses));
  localStorage.setItem("tasks",JSON.stringify(tasks));
}

function showCourseForm(){
  document.getElementById("courseForm").hidden = !document.getElementById("courseForm").hidden;
}

function displayCourses(){
  let list = document.getElementById("courses");
  list.innerHTML = "";
  let unitsTotal = 0, gradeTotal = 0;

  courses.forEach((c,i)=>{
    unitsTotal += c.units;
    gradeTotal += c.units*c.grade;
    list.innerHTML += `<div class="item">
      <div><b>${c.name}</b><small>${c.units} unit(s)</small></div>
      <div><b>${c.grade.toFixed(2)}</b>
      <button class="remove" onclick="deleteCourse(${i})">Remove</button></div>
    </div>`;
  });

  document.getElementById("gpa").textContent =
    unitsTotal ? (gradeTotal/unitsTotal).toFixed(2) : "0.00";
}

function deleteCourse(i){
  courses.splice(i,1);
  save();
  displayCourses();
}

document.getElementById("courseForm").onsubmit = function(e){
  e.preventDefault();
  courses.push({
    name:document.getElementById("courseName").value,
    units:Number(document.getElementById("units").value),
    grade:Number(document.getElementById("grade").value)
  });
  save();
  displayCourses();
  this.reset();
  this.hidden = true;
};

function displayTasks(){
  let list = document.getElementById("tasks");
  list.innerHTML = "";
  tasks.sort((a,b)=>new Date(a.due)-new Date(b.due));

  tasks.forEach((t,i)=>{
    let remaining = new Date(t.due)-new Date();
    let days = Math.floor(remaining/86400000);
    let hours = Math.floor((remaining%86400000)/3600000);
    let countdown = remaining <= 0 ? "Due now / overdue" : days+" day(s), "+hours+" hour(s) left";

    list.innerHTML += `<div class="item">
      <div><b>${t.title}</b><small>${t.type} | ${new Date(t.due).toLocaleString()}</small>
      <small>${countdown}</small></div>
      <button class="remove" onclick="deleteTask(${i})">Remove</button>
    </div>`;
  });
}

function deleteTask(i){
  tasks.splice(i,1);
  save();
  displayTasks();
}

document.getElementById("taskForm").onsubmit = function(e){
  e.preventDefault();
  tasks.push({
    title:document.getElementById("taskTitle").value,
    type:document.getElementById("taskType").value,
    due:document.getElementById("dueDate").value
  });
  save();
  displayTasks();
  this.reset();
};

displayCourses();
displayTasks();
setInterval(displayTasks,60000);
</script>
</body>
</html>
